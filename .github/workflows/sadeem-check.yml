name: Sadeem check

# Talks to Sadeem on the live site with fixed buyer conversations and checks
# each reply (scripts/sadeem-check.mjs). Runs after every deploy, or by hand
# from the Actions tab ("Run workflow"). The report is on the run's Summary page.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/dreamy-sagan-pnpcig

concurrency:
  group: sadeem-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for Coolify to deploy
        if: github.event_name == 'push'
        # Builds usually take 1-2 minutes but have taken 7 (12 Nov, #52): with
        # 5 minutes the check ran against the previous version.
        run: sleep 600
      - run: node scripts/sadeem-check.mjs
