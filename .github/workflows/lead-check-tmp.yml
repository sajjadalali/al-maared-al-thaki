name: Live check (temporary)
# Live check of the new home page. This branch is deleted afterwards.
on:
  push:
    branches:
      - claude/lead-check-tmp
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: node qa/live9.mjs
      - run: |
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git add -f qa/out && git commit -q -m "Temporary: live home check" && git push -q origin HEAD:claude/lead-check-tmp-out -f
