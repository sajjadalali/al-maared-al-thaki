name: Live check (temporary)
# Live check of PRs #75-#76: the buyer's 16 messages, 3 rounds 10 minutes apart. This branch is deleted afterwards.
on:
  push:
    branches:
      - claude/lead-check-tmp
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ROUND=1 node qa/live4.mjs
      - run: sleep 620
      - run: ROUND=2 node qa/live4.mjs
      - run: sleep 620
      - run: ROUND=3 node qa/live4.mjs
