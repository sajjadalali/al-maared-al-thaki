name: Fetch car photos

# Downloads the licensed Wikimedia Commons photos listed in the research
# workbook into public/cars and commits them with the updated cars.xlsx,
# cars.json and image credits (same as `npm run fetch-photos && npm run import-cars`).
on:
  workflow_dispatch:
  push:
    paths:
      - "content/research/**"
      - "scripts/fetch-photos.mjs"
      - ".github/workflows/fetch-photos.yml"

permissions:
  contents: write

concurrency:
  group: fetch-photos-${{ github.ref }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch-photos
      - run: npm run import-cars
      - name: Commit photos
        run: |
          git add public/cars content/cars.xlsx src/data/cars.json src/data/image-credits.json
          if git diff --cached --quiet; then
            echo "No new photos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fetch licensed car photos from Wikimedia Commons"
          git push
