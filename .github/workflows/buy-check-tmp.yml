name: Live road check (temporary)
on:
  push:
    branches:
      - claude/buy-check-tmp
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm i playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > s.mjs <<'JS'
          import { chromium } from "playwright";
          const b = await chromium.launch();
          const p = await b.newPage({ viewport: { width: 1366, height: 820 } });
          const errors = []; p.on("pageerror", (e) => errors.push(String(e)));
          await p.goto("https://maared-al-thaki.duckdns.org/?test", { waitUntil: "networkidle" });
          const seen = new Set(); const ys = [];
          for (let i = 0; i < 60; i++) {
            const s = await p.evaluate(() => {
              const g = [...document.querySelectorAll(".hero-road svg > g")].find((g) => g.querySelector('circle[r="4.5"]'));
              return { active: [...document.querySelectorAll(".hero-road-stop")].findIndex((g) => g.hasAttribute("data-active")), y: g ? Math.round(parseFloat(g.getAttribute("transform").split(" ")[1])) : null, live: document.querySelector(".hero-road").hasAttribute("data-road-live") };
            });
            seen.add(s.active); ys.push(s.y); await p.waitForTimeout(250);
          }
          console.log("ROAD live stops-visited", [...seen].sort().join(","), "| light y range", Math.min(...ys), "-", Math.max(...ys));
          await p.locator(".hero-road li").nth(1).hover(); await p.waitForTimeout(2500);
          console.log("ROAD hover stop 2 ->", await p.evaluate(() => [...document.querySelectorAll(".hero-road-stop")].findIndex((g) => g.hasAttribute("data-active"))), "| errors", errors.length);
          await b.close();
          JS
          node s.mjs
