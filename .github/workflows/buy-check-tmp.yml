name: Photo scout (temporary)
on:
  push:
    branches:
      - claude/buy-check-tmp
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow >/dev/null
      - run: python3 photo-scout/scout.py
      - run: python3 photo-scout/full.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photo-scout/out && git commit -qm "Photo scout results" && git push
