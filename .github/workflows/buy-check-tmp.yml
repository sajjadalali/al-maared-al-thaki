name: Live header menu check (temporary)
on:
  push:
    branches:
      - claude/buy-check-tmp
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          curl -s https://maared-al-thaki.duckdns.org/about -o p.html
          echo "menu button: $(grep -c 'aria-label="قائمة السيارات"' p.html)"
          echo "old bar links: $(grep -o '>الجديدة<\|>المستعملة<' p.html | wc -l)"
