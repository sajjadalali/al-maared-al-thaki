name: Live photos check (temporary)
on:
  push:
    branches:
      - claude/buy-check-tmp
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm i playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > s.mjs <<'JS'
          import { chromium } from "playwright";
          const S = "https://maared-al-thaki.duckdns.org";
          const b = await chromium.launch();
          const p = await b.newPage({ viewport: { width: 1280, height: 900 } });
          for (const car of ["car-002", "car-023", "car-029"]) {
            await p.goto(`${S}/cars/${car}`, { waitUntil: "networkidle" }); await p.waitForTimeout(4000); await p.goto(`${S}/cars/${car}`, { waitUntil: "networkidle" });
            const thumbs = await p.$$eval("img", (els) => els.filter((i) => /car-0(02|23|29)-\d/.test(decodeURIComponent(i.src))).map((i) => `${decodeURIComponent(i.src).match(/car-0\d\d-\d/)[0]}:${i.naturalWidth > 0 ? "ok" : "BROKEN"}`));
            const credit = await p.locator("text=صورة توضيحية للموديل").first().innerText().catch(() => "no credit");
            console.log("CAR", car, [...new Set(thumbs)].join(" "), "|", credit.replace(/\s+/g, " ").slice(0, 90));
          }
          await p.goto(`${S}/credits`, { waitUntil: "networkidle" });
          const html = await p.content();
          console.log("CREDITS", ["Damian B Oh", "Ethan Llamas", "HJUdall", "Bull-Doser"].map((a) => `${a}:${html.includes(a)}`).join(" "), "| old UK photo:", html.includes("DeFacto"));
          const cls = await p.$eval("footer", (f) => [...new Set([...f.querySelectorAll("*")].flatMap((e) => [...e.classList]).filter((c) => /^text-white\/\d+$/.test(c)))].join(" "));
          console.log("FOOTER", cls);
          const r = await fetch(`${S}/cars/car-023-1.webp`); console.log("OLD FILE", r.status);
          await b.close();
          JS
          node s.mjs
