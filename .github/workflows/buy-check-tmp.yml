name: Live road scroll check (temporary)
on:
  push:
    branches:
      - claude/buy-check-tmp
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm i playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > s.mjs <<'JS'
          import { chromium } from "playwright";
          const S = "https://maared-al-thaki.duckdns.org/?test";
          const LIGHT = () => { const g = [...document.querySelectorAll(".hero-road svg > g")].find((g) => g.querySelector('circle[r="4.5"]')); return Math.round(parseFloat(g.getAttribute("transform").split(" ")[1])); };
          const EYE = () => Math.round(innerHeight * 0.6 - document.querySelector(".hero-road").getBoundingClientRect().top);
          const b = await chromium.launch();
          const errors = [];
          const d = await b.newPage({ viewport: { width: 1366, height: 820 } }); d.on("pageerror", (e) => errors.push(String(e)));
          await d.goto(S, { waitUntil: "networkidle" }); await d.waitForTimeout(4500);
          const out = [`auto ${await d.evaluate(LIGHT)}`];
          for (const y of [80, 160, 240, 120, 0]) { await d.evaluate((y) => scrollTo(0, y), y); await d.waitForTimeout(700); out.push(`${y}:${await d.evaluate(LIGHT)}`); }
          console.log("DESKTOP", out.join(" "));
          await d.locator(".hero-road li").nth(2).hover(); await d.waitForTimeout(1500);
          console.log("PICK", await d.evaluate(LIGHT), await d.evaluate(() => [...document.querySelectorAll(".hero-road li > div")].map((x) => getComputedStyle(x).opacity).join(",")));
          const m = await b.newPage({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true }); m.on("pageerror", (e) => errors.push(String(e)));
          await m.goto(S, { waitUntil: "networkidle" }); await m.waitForTimeout(2500);
          const ph = [];
          for (const y of [300, 500, 700, 500, 300]) { await m.evaluate((y) => scrollTo(0, y), y); await m.waitForTimeout(800); ph.push(`${y}: light ${await m.evaluate(LIGHT)} eye ${await m.evaluate(EYE)}`); }
          console.log("PHONE", ph.join(" | "), "| errors", errors.length);
          await b.close();
          JS
          node s.mjs
