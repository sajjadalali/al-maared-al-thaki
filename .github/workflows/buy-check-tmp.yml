name: Live impression check (temporary)
on:
  push:
    branches:
      - claude/buy-check-tmp
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          S=https://maared-al-thaki.duckdns.org
          for u in / /contact /privacy /sitemap.xml /nope-xyz; do
            curl -s -o /tmp/p.html -w "$u %{http_code} %{time_total}s\n" "$S$u"
            echo "  email: $(grep -c 'hi@sajjadalali' /tmp/p.html)  support: $(grep -c 'الدعم الفني' /tmp/p.html)  privacy-link: $(grep -c 'href=\"/privacy\"' /tmp/p.html)  afterHours: $(grep -c 'حتى برا الدوام' /tmp/p.html)"
          done
          echo "WARM 1: $(curl -s -X POST $S/api/chat/warm)"
          echo "WARM 2: $(curl -s -X POST $S/api/chat/warm)"
          npm i playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > s.mjs <<'JS'
          import { chromium } from "playwright";
          const b = await chromium.launch();
          const ctx = await b.newContext({ viewport: { width: 393, height: 852 }, isMobile: true, hasTouch: true });
          const p = await ctx.newPage();
          const warm = [];
          p.on("request", (r) => { if (r.url().includes("/api/chat/warm")) warm.push(r.method()); });
          await p.goto("https://maared-al-thaki.duckdns.org/?test", { waitUntil: "networkidle" });
          await p.getByRole("button", { name: /سديم/ }).first().click();
          await p.waitForTimeout(2500);
          console.log("WARM REQUESTS ON OPEN", JSON.stringify(warm));
          await b.close();
          JS
          node s.mjs
